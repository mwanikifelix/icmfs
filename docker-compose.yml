services:
  backend:
    user: "${UID:-1000}:${GID:-1000}"
    container_name: icmfs_backend
    build:
      context: ./backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:3000
      "
    volumes:
      - ./backend:/app
    ports:
      - "97:3000"
    environment:
      DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret-key
      DB_NAME: icmfs_db
      DB_USER: root
      DB_PASSWORD: feloo
      DB_HOST: postgres  # Use 'postgres' not 'postgresql' - matches your existing container
      DB_PORT: 5432
      REDIS_HOST: redis-stack  # Use 'redis-stack' - matches your existing container
      REDIS_PORT: 6379
      REDIS_PASSWORD: feloo
    networks:
      shared:
        ipv4_address: 172.21.0.11  # Changed to avoid conflicts

  frontend:
    container_name: icmfs_frontend
    build:
      context: ./frontend
    ports:
      - "98:5173"
    command: npm run dev -- --host
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      shared:
        ipv4_address: 172.21.0.12  # Changed to avoid conflicts

networks:
  shared:
    external: true  # Use existing shared network